# Trusted configuration, never generated by the model. Executables run without a shell.
apps:
  notepad:
    paths: ["%WINDIR%/System32/notepad.exe"]
  calculator:
    paths: ["%WINDIR%/System32/calc.exe"]
  explorer:
    paths: ["%WINDIR%/explorer.exe"]
  chrome:
    paths:
      - "%PROGRAMFILES%/Google/Chrome/Application/chrome.exe"
      - "%PROGRAMFILES(X86)%/Google/Chrome/Application/chrome.exe"
      - "%LOCALAPPDATA%/Google/Chrome/Application/chrome.exe"
  edge:
    paths:
      - "%PROGRAMFILES(X86)%/Microsoft/Edge/Application/msedge.exe"
      - "%PROGRAMFILES%/Microsoft/Edge/Application/msedge.exe"
# F8: listen; F9: interrupt speech; Ctrl+C: stop.
