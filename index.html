<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aurelia OS V2</title>
  <link rel="icon" href="./assets/favicon.svg" />
  <style>
    :root{
      --bg:#0f1118; --panel:#171925; --panel2:#202333; --text:#f8ebd2; --muted:#b9ac9c;
      --gold:#d8b66a; --rose:#9b456d; --green:#526f5a; --line:rgba(255,255,255,.1);
      --shadow:0 20px 60px rgba(0,0,0,.35); --radius:22px;
    }
    *{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at top left,#2b2335 0,#0f1118 42%,#090a0f 100%);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
    h1,h2,h3{font-family:Georgia,serif;margin:.1rem 0}.app{display:grid;grid-template-columns:290px 1fr;min-height:100vh}.side{position:sticky;top:0;height:100vh;padding:22px;background:rgba(12,13,20,.8);border-right:1px solid var(--line);backdrop-filter:blur(14px);overflow:auto}.brand{display:flex;gap:12px;align-items:center;margin-bottom:20px}.crest{width:48px;height:48px;border-radius:18px;background:linear-gradient(135deg,var(--gold),var(--rose));display:grid;place-items:center;color:#111;font-weight:900}.brand small{color:var(--muted)}.nav{display:grid;gap:8px}.nav button,.ghost,.primary,.danger{border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--text);border-radius:16px;padding:12px 14px;text-align:left;cursor:pointer;font-weight:700}.nav button.active{background:linear-gradient(135deg,rgba(216,182,106,.22),rgba(155,69,109,.24));border-color:rgba(216,182,106,.5)}.main{padding:28px;max-width:1350px;width:100%;margin:auto}.hero{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:20px}.hero p{color:var(--muted);max-width:760px}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}.card{background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.035));border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}.span12{grid-column:span 12}.span8{grid-column:span 8}.span6{grid-column:span 6}.span4{grid-column:span 4}.span3{grid-column:span 3}.pill{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:rgba(255,255,255,.05);border-radius:999px;padding:7px 11px;margin:4px 4px 4px 0;color:#f4e6c7;font-size:.9rem}.primary{background:linear-gradient(135deg,var(--gold),#e3c88b);color:#17120b;border:0;text-align:center}.danger{background:rgba(152,62,74,.22);border-color:rgba(255,130,130,.35);color:#ffd4d4;text-align:center}.ghost{text-align:center}label{display:block;font-size:.86rem;color:var(--muted);margin-bottom:6px}input,select,textarea{width:100%;background:#0f121c;color:var(--text);border:1px solid var(--line);border-radius:14px;padding:11px 12px;outline:none}textarea{min-height:90px;resize:vertical}.row{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.list{display:grid;gap:10px}.item{border:1px solid var(--line);border-radius:18px;padding:13px;background:rgba(0,0,0,.12)}.item p{color:var(--muted);margin:.35rem 0}.tiny{font-size:.82rem;color:var(--muted)}.hidden{display:none!important}.clothes{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}.cloth{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:rgba(0,0,0,.12)}.cloth img{width:100%;height:150px;object-fit:cover;display:block}.cloth div{padding:10px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.tabs button{border:1px solid var(--line);border-radius:999px;padding:9px 13px;background:rgba(255,255,255,.04);color:var(--text);cursor:pointer}.tabs button.active{background:var(--gold);color:#111}.progress{height:10px;background:#0f121c;border-radius:999px;overflow:hidden;border:1px solid var(--line)}.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--gold));width:0%}.quote{font-family:Georgia,serif;font-style:italic;color:#f1d99f}.resource a,.item a{color:#f1cf82}.miniCal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.day{min-height:72px;border:1px solid var(--line);border-radius:14px;padding:7px;background:rgba(255,255,255,.03);font-size:.82rem}.day.today{border-color:var(--gold);background:rgba(216,182,106,.12)}.eventdot{display:block;margin-top:4px;background:rgba(155,69,109,.55);border-radius:9px;padding:2px 5px;font-size:.72rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.toast{position:fixed;right:20px;bottom:20px;background:#171925;border:1px solid var(--line);border-radius:16px;padding:13px 16px;box-shadow:var(--shadow);z-index:9}.mobileTop{display:none}@media(max-width:900px){.app{grid-template-columns:1fr}.side{display:none}.mobileTop{display:flex;position:sticky;top:0;z-index:5;background:#10121a;padding:10px;gap:8px;overflow:auto;border-bottom:1px solid var(--line)}.mobileTop button{white-space:nowrap}.main{padding:16px}.span8,.span6,.span4,.span3{grid-column:span 12}.hero{display:block}.row,.row3{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div class="mobileTop" id="mobileNav"></div>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="crest">A</div><div><h2>Aurelia OS</h2><small>free lifestyle dashboard v2</small></div></div>
    <div class="nav" id="nav"></div>
    <div class="card" style="margin-top:16px"><div class="quote">“Classy, strong, educated, magnetic.”</div><p class="tiny">Everything is saved locally in your browser. Export backups often.</p></div>
  </aside>
  <main class="main">
    <div class="hero"><div><h1 id="pageTitle">Dashboard</h1><p id="pageSub">Mood, calendar, outfits, books, learning, skincare, habits and knowledge in one free static app.</p></div><button class="primary" onclick="generateDay()">Generate today</button></div>
    <section id="dashboard" class="page"></section>
    <section id="calendar" class="page hidden"></section>
    <section id="wardrobe" class="page hidden"></section>
    <section id="books" class="page hidden"></section>
    <section id="beauty" class="page hidden"></section>
    <section id="learning" class="page hidden"></section>
    <section id="smart" class="page hidden"></section>
    <section id="habits" class="page hidden"></section>
    <section id="settings" class="page hidden"></section>
  </main>
</div>
<div id="toast" class="toast hidden"></div>
<script>
const LS='aurelia-v2-data';
const todayKey=()=>new Date().toISOString().slice(0,10);
const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);
const defaultData={
  profile:{name:'Ilona',aesthetics:['dark academia','modern fae','royal court'],city:'Rennes',googleClientId:''},
  mood:'Dark Academia', energy:'Medium', occasion:'study', weather:null, dayPlan:null,
  clothes:[], events:[], habits:[
    {id:uid(),name:'Skincare',done:{}},{id:uid(),name:'Stretch 10 min',done:{}},{id:uid(),name:'Read 10 pages',done:{}},{id:uid(),name:'Spanish/Japanese/LSF drill',done:{}}
  ],
  booksSaved:[], products:[], prices:[], knowledgeSaved:[], customCards:[], languageLog:[], changelog:[]
};
let data=load();
function load(){try{return {...defaultData,...JSON.parse(localStorage.getItem(LS)||'{}')}}catch(e){return structuredClone(defaultData)}}
function save(){localStorage.setItem(LS,JSON.stringify(data));}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2600)}
function esc(s=''){return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
const pages=[['dashboard','Dashboard','daily aura'],['calendar','Calendar','manual, .ics, optional Google'],['wardrobe','Wardrobe','closet + outfits'],['books','Book Oracle','romantasy recs'],['beauty','Beauty + Prices','skincare, scent, wishlist'],['learning','Languages','Spanish, Japanese, LSF'],['smart','Smart Scroll','sourced knowledge'],['habits','Habits','quests + streaks'],['settings','Settings','backup + APIs']];
function buildNav(){const n=document.getElementById('nav'), m=document.getElementById('mobileNav');n.innerHTML=m.innerHTML=''; pages.forEach(([id,label])=>{for(const c of [n,m]){const b=document.createElement('button');b.textContent=label;b.onclick=()=>show(id);b.dataset.page=id;c.appendChild(b)}})}
function show(id){document.querySelectorAll('.page').forEach(p=>p.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===id));const p=pages.find(x=>x[0]===id);document.getElementById('pageTitle').textContent=p[1];document.getElementById('pageSub').textContent=p[2]; renderAll(false)}
const moodMap={
 'Soft Fae':{colors:['cream','white','pink','sage'],workout:'gentle mobility + long walk',book:'soft romantasy, healing arc, forest magic',beauty:'glowy skin, soft hair, vanilla musk',food:'warm toast, fruit, protein yogurt'},
 'Dark Academia':{colors:['black','brown','grey','burgundy'],workout:'posture + core + 20 min walk',book:'court politics, morally grey characters, library vibes',beauty:'clean skin, neat hair, amber scent',food:'protein pasta or soup + bread'},
 'Warrior Mode':{colors:['black','red','green','gold'],workout:'legs, agility, core, balance',book:'strong FMC, training, revenge, dragons',beauty:'slick hair, sunscreen, woody scent',food:'high protein comfort meal'},
 'Royal Court':{colors:['cream','black','gold','burgundy'],workout:'pilates posture + glutes',book:'political intrigue, gowns, dangerous romance',beauty:'polished skin, jewelry, elegant perfume',food:'fancy student plate'},
 'Recovery Day':{colors:['grey','cream','soft'],workout:'stretching only + hydration',book:'comfort fantasy, low stress',beauty:'repair routine, no new actives',food:'easy pasta or toastie'}
};
function generateDay(){const m=moodMap[data.mood]||moodMap['Dark Academia'];const clothes=pickOutfit();const ev=todaysEvents();data.dayPlan={date:todayKey(),aura:`${data.mood} ${data.energy} ${data.occasion}`.trim(),outfit:clothes.title,workout:m.workout,book:m.book,beauty:m.beauty,food:m.food,events:ev.slice(0,3).map(e=>e.title),quest:random(['clean desk for 5 min','drink water before coffee','walk outside 10 min','read one chapter','prepare tomorrow outfit','do a 15-min language drill']),knowledge:random(seedCards()).title};save();renderDashboard();toast('Daily plan generated')}
function random(a){return a[Math.floor(Math.random()*a.length)]}
function getWeatherAdvice(){if(!data.weather)return 'Add your city and fetch weather for smarter outfits.';const t=data.weather.temp; if(t<8)return 'Cold: coat, warm layers, boots.'; if(t<16)return 'Mild-cold: jacket, long sleeves, closed shoes.'; if(t<25)return 'Comfortable: light layers.'; return 'Hot: breathable fabrics, SPF, hair up.'}
async function fetchWeather(){const city=document.getElementById('city').value||data.profile.city||'Rennes';try{const geo=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=en&format=json`).then(r=>r.json());const g=geo.results?.[0];if(!g)throw new Error('City not found');const w=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${g.latitude}&longitude=${g.longitude}&current=temperature_2m,precipitation,wind_speed_10m&timezone=auto`).then(r=>r.json());data.profile.city=city;data.weather={city:g.name,temp:w.current.temperature_2m,wind:w.current.wind_speed_10m,rain:w.current.precipitation};save();renderDashboard();toast('Weather updated')}catch(e){toast('Weather failed: '+e.message)}}
function renderDashboard(){const el=document.getElementById('dashboard');const plan=data.dayPlan;el.innerHTML=`<div class="grid">
 <div class="card span8"><h2>Daily Aura</h2><div class="row3"><div><label>Mood</label><select id="moodSel" onchange="data.mood=this.value;save();renderDashboard()">${Object.keys(moodMap).map(m=>`<option ${data.mood===m?'selected':''}>${m}</option>`).join('')}</select></div><div><label>Energy</label><select onchange="data.energy=this.value;save()"><option>Low</option><option ${data.energy==='Medium'?'selected':''}>Medium</option><option ${data.energy==='High'?'selected':''}>High</option></select></div><div><label>Occasion</label><input value="${esc(data.occasion)}" onchange="data.occasion=this.value;save()"></div></div><br><button class="primary" onclick="generateDay()">Generate mood-based day</button>${plan?`<div class="item" style="margin-top:14px"><h3>${esc(plan.aura)}</h3><span class="pill">Outfit: ${esc(plan.outfit)}</span><span class="pill">Workout: ${esc(plan.workout)}</span><span class="pill">Book: ${esc(plan.book)}</span><span class="pill">Beauty: ${esc(plan.beauty)}</span><span class="pill">Food: ${esc(plan.food)}</span><p><b>Main quest:</b> ${esc(plan.quest)}</p><p><b>Knowledge:</b> ${esc(plan.knowledge)}</p>${plan.events?.length?`<p><b>Calendar:</b> ${plan.events.map(esc).join(', ')}</p>`:''}</div>`:'<p class="tiny">Click generate to create a plan from your mood, wardrobe, calendar and weather.</p>'}</div>
 <div class="card span4"><h2>Weather styling</h2><div class="row"><div><label>City</label><input id="city" value="${esc(data.profile.city||'')}"></div><div style="display:flex;align-items:end"><button class="ghost" onclick="fetchWeather()">Fetch</button></div></div><p>${data.weather?`<b>${esc(data.weather.city)}</b>: ${data.weather.temp}°C, wind ${data.weather.wind} km/h, rain ${data.weather.rain}mm`:'No weather yet.'}</p><p class="pill">${getWeatherAdvice()}</p></div>
 <div class="card span4"><h2>Today calendar</h2><div class="list">${todaysEvents().slice(0,4).map(eventHtml).join('')||'<p class="tiny">No event today. Add/import events in Calendar.</p>'}</div></div>
 <div class="card span4"><h2>Next outfit</h2>${outfitHtml(pickOutfit())}</div>
 <div class="card span4"><h2>Quest streak</h2>${habitSummary()}</div>
 <div class="card span6"><h2>Quick actions</h2><button class="ghost" onclick="show('books')">Find hidden-gem romantasy</button> <button class="ghost" onclick="show('learning')">Open language drills</button> <button class="ghost" onclick="show('beauty')">Compare skincare prices</button> <button class="ghost" onclick="show('smart')">Smart scroll</button></div>
 <div class="card span6"><h2>Update system</h2><p class="tiny">Use Settings → Import Data Pack to add new books, routines, resources or knowledge cards without recoding the site.</p><button class="primary" onclick="show('settings')">Open settings + backups</button></div>
 </div>`}
function eventHtml(e){return `<div class="item"><b>${esc(e.title)}</b><p>${esc(e.date||'')} ${esc(e.time||'')} ${e.source?`· ${esc(e.source)}`:''}</p>${e.location?`<p>${esc(e.location)}</p>`:''}</div>`}
function todaysEvents(){return data.events.filter(e=>e.date===todayKey()).sort((a,b)=>(a.time||'').localeCompare(b.time||''))}
function habitSummary(){const total=data.habits.length;const done=data.habits.filter(h=>h.done?.[todayKey()]).length;return `<div class="progress"><span style="width:${total?done/total*100:0}%"></span></div><p>${done}/${total} quests done today</p>${data.habits.slice(0,4).map(h=>`<label><input type="checkbox" ${h.done?.[todayKey()]?'checked':''} onchange="toggleHabit('${h.id}')" style="width:auto"> ${esc(h.name)}</label>`).join('')}`}
function toggleHabit(id){const h=data.habits.find(x=>x.id===id);h.done=h.done||{};h.done[todayKey()]=!h.done[todayKey()];save();renderAll(false)}
function renderCalendar(){const el=document.getElementById('calendar');const d=new Date();const y=d.getFullYear(),m=d.getMonth();const first=new Date(y,m,1);const start=(first.getDay()+6)%7;const days=new Date(y,m+1,0).getDate();let cells='';for(let i=0;i<start;i++)cells+='<div></div>';for(let day=1;day<=days;day++){const key=`${y}-${String(m+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;const ev=data.events.filter(e=>e.date===key);cells+=`<div class="day ${key===todayKey()?'today':''}"><b>${day}</b>${ev.slice(0,3).map(e=>`<span class="eventdot">${esc(e.title)}</span>`).join('')}</div>`}
el.innerHTML=`<div class="grid"><div class="card span8"><h2>${d.toLocaleString('en',{month:'long'})} ${y}</h2><div class="miniCal"><b>Mon</b><b>Tue</b><b>Wed</b><b>Thu</b><b>Fri</b><b>Sat</b><b>Sun</b>${cells}</div></div><div class="card span4"><h2>Add event</h2><label>Title</label><input id="evTitle"><div class="row"><div><label>Date</label><input id="evDate" type="date" value="${todayKey()}"></div><div><label>Time</label><input id="evTime" type="time"></div></div><label>Location</label><input id="evLoc"><button class="primary" onclick="addEvent()">Add</button><hr><h3>Import .ics</h3><input type="file" accept=".ics,text/calendar" onchange="importICS(this.files[0])"><p class="tiny">Free option: export your calendar as .ics and import it here.</p><hr><h3>Google Calendar</h3><button class="ghost" onclick="connectGoogleCalendar()">Connect Google Calendar</button><button class="ghost" onclick="makeGoogleEventLink()">Create Google event link</button><p class="tiny">Direct connection needs your own free browser OAuth Client ID in Settings. Manual Google event link works without API.</p></div><div class="card span12"><h2>Events</h2><div class="list">${data.events.sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).slice(0,50).map(e=>`<div class="item"><b>${esc(e.title)}</b><p>${esc(e.date)} ${esc(e.time||'')} ${e.location?` · ${esc(e.location)}`:''}</p><button class="danger" onclick="delEvent('${e.id}')">Delete</button></div>`).join('')||'<p>No events yet.</p>'}</div></div></div>`}
function addEvent(){data.events.push({id:uid(),title:evTitle.value||'Untitled',date:evDate.value,time:evTime.value,location:evLoc.value,source:'manual'});save();renderCalendar();toast('Event added')}
function delEvent(id){data.events=data.events.filter(e=>e.id!==id);save();renderCalendar()}
function importICS(file){if(!file)return;const r=new FileReader();r.onload=()=>{const txt=r.result;const blocks=txt.split('BEGIN:VEVENT').slice(1);let count=0;blocks.forEach(b=>{const title=(b.match(/SUMMARY:(.*)/)||[])[1]?.trim()||'Calendar event';const loc=(b.match(/LOCATION:(.*)/)||[])[1]?.trim()||'';let dt=(b.match(/DTSTART(?:;[^:]+)?:([0-9T]+)/)||[])[1];if(dt){const date=dt.slice(0,4)+'-'+dt.slice(4,6)+'-'+dt.slice(6,8);const time=dt.includes('T')?dt.slice(9,11)+':'+dt.slice(11,13):'';data.events.push({id:uid(),title,date,time,location:loc,source:'ics'});count++}});save();renderCalendar();toast(count+' events imported')};r.readAsText(file)}
function makeGoogleEventLink(){const title=encodeURIComponent('Aurelia life quest');const start=todayKey().replaceAll('-','')+'T180000';const end=todayKey().replaceAll('-','')+'T190000';window.open(`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${start}/${end}&details=Created%20from%20Aurelia%20OS`,'_blank')}
let tokenClient=null, accessToken=null;
function loadScript(src){return new Promise((res,rej)=>{if(document.querySelector(`script[src="${src}"]`))return res();const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
async function connectGoogleCalendar(){const clientId=data.profile.googleClientId;if(!clientId){toast('Add Google Client ID in Settings first');show('settings');return}try{await loadScript('https://accounts.google.com/gsi/client');tokenClient=google.accounts.oauth2.initTokenClient({client_id:clientId,scope:'https://www.googleapis.com/auth/calendar.readonly',callback:async r=>{accessToken=r.access_token;await fetchGoogleEvents()}});tokenClient.requestAccessToken()}catch(e){toast('Google connect failed: '+e.message)}}
async function fetchGoogleEvents(){try{const now=new Date().toISOString();const max=new Date(Date.now()+14*864e5).toISOString();const j=await fetch(`https://www.googleapis.com/calendar/v3/calendars/primary/events?timeMin=${encodeURIComponent(now)}&timeMax=${encodeURIComponent(max)}&singleEvents=true&orderBy=startTime`,{headers:{Authorization:'Bearer '+accessToken}}).then(r=>r.json());let c=0;(j.items||[]).forEach(it=>{const start=it.start?.dateTime||it.start?.date; if(!start)return;data.events.push({id:uid(),title:it.summary||'Google event',date:start.slice(0,10),time:start.includes('T')?start.slice(11,16):'',location:it.location||'',source:'google'});c++});save();renderCalendar();toast(c+' Google events imported')}catch(e){toast('Google Calendar read failed')}} 
function renderWardrobe(){const el=document.getElementById('wardrobe');el.innerHTML=`<div class="grid"><div class="card span4"><h2>Add clothing</h2><label>Photo</label><input type="file" accept="image/*" id="clothFile"><label>Name</label><input id="clothName" placeholder="black fitted top"><div class="row"><div><label>Category</label><select id="clothCat"><option>top</option><option>bottom</option><option>dress</option><option>coat</option><option>shoes</option><option>bag</option><option>jewelry</option></select></div><div><label>Color</label><input id="clothColor" placeholder="black"></div></div><label>Tags</label><input id="clothTags" placeholder="classy,dark academia,fae"><button class="primary" onclick="addCloth()">Save item</button><hr><button class="ghost" onclick="generateOutfitToast()">Generate outfit from closet</button></div><div class="card span8"><h2>Closet</h2><div class="clothes">${data.clothes.map(c=>`<div class="cloth"><img src="${c.img}"><div><b>${esc(c.name)}</b><p class="tiny">${esc(c.category)} · ${esc(c.color)}</p><p>${(c.tags||[]).map(t=>`<span class="pill">${esc(t)}</span>`).join('')}</p><button class="danger" onclick="delCloth('${c.id}')">Delete</button></div></div>`).join('')||'<p class="tiny">Upload a few pieces and tag them manually. This is free and private.</p>'}</div></div><div class="card span12"><h2>Outfit generator</h2>${outfitHtml(pickOutfit())}</div></div>`}
function addCloth(){const file=clothFile.files[0];if(!file)return toast('Choose a photo');const r=new FileReader();r.onload=()=>{data.clothes.push({id:uid(),img:r.result,name:clothName.value||'clothing item',category:clothCat.value,color:clothColor.value||'',tags:clothTags.value.split(',').map(x=>x.trim()).filter(Boolean)});save();renderWardrobe();toast('Clothing saved')};r.readAsDataURL(file)}
function delCloth(id){data.clothes=data.clothes.filter(c=>c.id!==id);save();renderWardrobe()}
function pickOutfit(){const tags=(moodMap[data.mood]?.colors||[]).concat([data.mood.toLowerCase()]);const score=c=>tags.some(t=>(c.color+' '+(c.tags||[]).join(' ')).toLowerCase().includes(t))?2:1;const cats=['top','bottom','dress','coat','shoes','bag','jewelry'];const chosen=[];cats.forEach(cat=>{const arr=data.clothes.filter(c=>c.category===cat).sort((a,b)=>score(b)-score(a));if(arr[0])chosen.push(arr[0])});if(!chosen.length)return {title:'Add clothes to unlock real outfit matching',items:[]};return {title:chosen.map(c=>c.name).join(' + '),items:chosen}}
function outfitHtml(o){return `<div class="item"><h3>${esc(o.title)}</h3>${o.items?.length?`<div class="clothes">${o.items.map(c=>`<div class="cloth"><img src="${c.img}"><div><b>${esc(c.name)}</b><p class="tiny">${esc(c.color)} ${esc(c.category)}</p></div></div>`).join('')}</div>`:'<p class="tiny">No outfit yet.</p>'}<p class="tiny">Matched from mood: ${esc(data.mood)}. Weather note: ${esc(getWeatherAdvice())}</p></div>`}
function generateOutfitToast(){toast(pickOutfit().title)}
const hiddenBooks=[
 {title:'The Bridge Kingdom',author:'Danielle L. Jensen',tags:['politics','strong FMC','enemies']},{title:'Daughter of No Worlds',author:'Carissa Broadbent',tags:['powerful FMC','slow burn','magic']},{title:'Reign & Ruin',author:'J.D. Evans',tags:['politics','mature romance','magic']},{title:'The Jasad Heir',author:'Sara Hashem',tags:['hidden identity','politics','enemies']},{title:'A Fate of Wrath & Flame',author:'K.A. Tucker',tags:['portal','royal court','romance']},{title:'The Witch Collector',author:'Charissa Weaks',tags:['witch','quest','romance']},{title:'This Vicious Grace',author:'Emily Thiede',tags:['chosen one','bodyguard','banter']},{title:'The Hurricane Wars',author:'Thea Guanzon',tags:['enemies','war','magic']}
];
async function searchBooks(){const q=bookQ.value||'romantasy strong female lead';bookResults.innerHTML='<p>Searching...</p>';try{const [ol,gb]=await Promise.allSettled([fetch(`https://openlibrary.org/search.json?q=${encodeURIComponent(q)}&limit=10`).then(r=>r.json()),fetch(`https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(q)}&maxResults=10`).then(r=>r.json())]);let results=[];if(ol.value)results=results.concat(ol.value.docs.map(b=>({title:b.title,author:b.author_name?.[0]||'Unknown',year:b.first_publish_year,cover:b.cover_i?`https://covers.openlibrary.org/b/id/${b.cover_i}-M.jpg`:'' ,source:'Open Library'})));if(gb.value)results=results.concat((gb.value.items||[]).map(v=>({title:v.volumeInfo.title,author:v.volumeInfo.authors?.[0]||'Unknown',year:v.volumeInfo.publishedDate,cover:v.volumeInfo.imageLinks?.thumbnail||'',link:v.volumeInfo.infoLink,source:'Google Books'})));bookResults.innerHTML=results.slice(0,12).map(bookCard).join('')||'<p>No results.</p>'}catch(e){bookResults.innerHTML='<p>Search failed. Try again later.</p>'}}
function bookCard(b){const enc=encodeURIComponent(`${b.title} ${b.author}`);return `<div class="item"><div style="display:flex;gap:12px"><div>${b.cover?`<img src="${b.cover}" style="width:70px;border-radius:10px">`:'📚'}</div><div><b>${esc(b.title)}</b><p>${esc(b.author)} ${b.year?`· ${esc(b.year)}`:''} · ${esc(b.source||'curated')}</p><a href="${b.link||`https://openlibrary.org/search?q=${enc}`}" target="_blank">Open source</a><br><button class="ghost" onclick='saveBook(${JSON.stringify(b).replaceAll("'","&apos;")})'>Save TBR</button></div></div></div>`}
function saveBook(b){data.booksSaved.push({...b,id:uid()});save();renderBooks();toast('Saved to TBR')}
function renderBooks(){const el=document.getElementById('books');el.innerHTML=`<div class="grid"><div class="card span4"><h2>Book Oracle</h2><label>Search mood/trope</label><input id="bookQ" placeholder="fae court politics strong FMC"><button class="primary" onclick="searchBooks()">Search free APIs</button><p class="tiny">Uses Open Library and Google Books. Results are metadata, not perfect trope truth.</p><h3>Hidden-ish romantasy picks</h3>${hiddenBooks.map(b=>`<span class="pill" onclick='saveBook(${JSON.stringify(b)})'>${esc(b.title)}</span>`).join('')}</div><div class="card span8"><h2>Results</h2><div id="bookResults" class="list">${hiddenBooks.map(bookCard).join('')}</div></div><div class="card span12"><h2>Your TBR</h2><div class="list">${data.booksSaved.map(b=>`<div class="item"><b>${esc(b.title)}</b><p>${esc(b.author||'')}</p><button class="danger" onclick="data.booksSaved=data.booksSaved.filter(x=>x.id!=='${b.id}');save();renderBooks()">Remove</button></div>`).join('')||'<p>No saved books yet.</p>'}</div></div></div>`}
async function searchBeauty(){beautyResults.innerHTML='<p>Searching...</p>';const q=beautyQ.value.trim();try{let j;if(/^\d{8,14}$/.test(q)){j=await fetch(`https://world.openbeautyfacts.org/api/v2/product/${q}.json`).then(r=>r.json());const p=j.product?[j.product]:[]}else{j=await fetch(`https://world.openbeautyfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&action=process&json=1&page_size=10`).then(r=>r.json())}const products=j.product?[j.product]:(j.products||[]);beautyResults.innerHTML=products.slice(0,10).map(p=>`<div class="item"><b>${esc(p.product_name||'Unknown product')}</b><p>${esc(p.brands||'')} · ${esc(p.categories||'')}</p><p class="tiny">Ingredients: ${esc((p.ingredients_text||'').slice(0,220))}</p><button class="ghost" onclick='saveProduct(${JSON.stringify({name:p.product_name||"product",brand:p.brands||"",ingredients:p.ingredients_text||""}).replaceAll("'","&apos;")})'>Save product</button></div>`).join('')||'<p>No products found.</p>'}catch(e){beautyResults.innerHTML='<p>Beauty API failed. You can still track prices manually.</p>'}}
function saveProduct(p){data.products.push({...p,id:uid()});save();renderBeauty();toast('Product saved')}
function addPrice(){data.prices.push({id:uid(),name:priceName.value,store:priceStore.value,price:Number(priceVal.value||0),link:priceLink.value,note:priceNote.value,date:todayKey()});save();renderBeauty()}
function renderBeauty(){const el=document.getElementById('beauty');const best=[...data.prices].sort((a,b)=>a.price-b.price)[0];el.innerHTML=`<div class="grid"><div class="card span4"><h2>Skincare finder</h2><label>Barcode or product search</label><input id="beautyQ" placeholder="cerave cleanser or barcode"><button class="primary" onclick="searchBeauty()">Search Open Beauty Facts</button><p class="tiny">This checks product/ingredient data, not live prices.</p><h3>Scent aura</h3><p class="pill">${moodMap[data.mood]?.beauty}</p></div><div class="card span8"><h2>Results</h2><div id="beautyResults" class="list"></div></div><div class="card span4"><h2>Price tracker</h2><label>Product</label><input id="priceName"><div class="row"><div><label>Store</label><input id="priceStore"></div><div><label>Price €</label><input id="priceVal" type="number" step="0.01"></div></div><label>Link</label><input id="priceLink"><label>Note</label><input id="priceNote" placeholder="promo, size, shipping"><button class="primary" onclick="addPrice()">Add price</button></div><div class="card span8"><h2>Wishlist comparison</h2>${best?`<p class="pill">Best current: ${esc(best.name)} at ${esc(best.store)} — ${best.price}€</p>`:''}<div class="list">${data.prices.map(p=>`<div class="item"><b>${esc(p.name)}</b><p>${esc(p.store)} · ${p.price}€ · ${esc(p.date)}</p>${p.link?`<a target="_blank" href="${esc(p.link)}">Open store</a>`:''}<p class="tiny">${esc(p.note||'')}</p><button class="danger" onclick="data.prices=data.prices.filter(x=>x.id!=='${p.id}');save();renderBeauty()">Delete</button></div>`).join('')||'<p>No prices yet. Add product links and prices when you shop.</p>'}</div></div><div class="card span12"><h2>Saved products</h2><div class="list">${data.products.map(p=>`<div class="item"><b>${esc(p.name)}</b><p>${esc(p.brand)}</p><p class="tiny">${esc((p.ingredients||'').slice(0,260))}</p></div>`).join('')||'<p>No saved products.</p>'}</div></div></div>`}
const resources={Spanish:[['Language Transfer Complete Spanish','https://www.languagetransfer.org/complete-spanish'],['Tatoeba Spanish sentences','https://tatoeba.org/en/sentences/search?query=&from=spa&to=eng'],['SpanishDict conjugation','https://www.spanishdict.com/conjugation']],Japanese:[['NHK Easy Japanese','https://www.nhk.or.jp/lesson/en/'],['Jisho dictionary','https://jisho.org/'],['WaniKani API/reference','https://docs.api.wanikani.com/']],LSF:[['Dico Elix LSF','https://dico.elix-lsf.fr/'],['Signes de Sens / Elix','https://www.elix-lsf.fr/'],['Daily LSF search','https://dico.elix-lsf.fr/recherche']]} ;
function makeDrill(){const lang=langSel.value;const tasks={Spanish:['10 min Language Transfer audio','write 5 sentences about today','review 8 verbs in present/past','shadow 3 Tatoeba sentences'],Japanese:['learn 5 kana/kanji/vocab','read one NHK mini lesson','search 5 words in Jisho','write 3 simple sentences'],LSF:['learn 5 signs on Elix','record yourself signing 3 words','review facial expression/body placement','search signs for your daily routine']};drillBox.innerHTML=`<div class="item"><h3>${lang} drill</h3>${tasks[lang].map(t=>`<p>□ ${t}</p>`).join('')}<button class="primary" onclick="data.languageLog.push({id:uid(),date:todayKey(),lang:'${lang}',note:'completed drill'});save();renderLearning()">Mark done</button></div>`}
function renderLearning(){const el=document.getElementById('learning');el.innerHTML=`<div class="grid"><div class="card span4"><h2>Language cockpit</h2><label>Language</label><select id="langSel"><option>Spanish</option><option>Japanese</option><option>LSF</option></select><button class="primary" onclick="makeDrill()">Generate daily drill</button><div id="drillBox"></div></div><div class="card span8"><h2>Free resource links</h2>${Object.entries(resources).map(([k,arr])=>`<div class="item resource"><h3>${k}</h3>${arr.map(([n,u])=>`<p><a target="_blank" href="${u}">${n}</a></p>`).join('')}</div>`).join('')}</div><div class="card span12"><h2>Learning log</h2><div class="list">${data.languageLog.map(l=>`<div class="item"><b>${esc(l.lang)}</b><p>${esc(l.date)} · ${esc(l.note)}</p></div>`).join('')||'<p>No language log yet.</p>'}</div></div></div>`}
const baseCards=[
 {theme:'fitness',title:'Progressive overload',q:'progressive overload strength training',body:'Training improves when difficulty increases gradually: reps, load, range, control or frequency.'},
 {theme:'skincare',title:'Sunscreen is the boring glow-up',q:'sunscreen skin aging dermatology',body:'A basic morning routine is usually more effective than constantly trying new actives.'},
 {theme:'mythology',title:'Valkyries and warrior imagery',q:'Valkyrie Norse mythology',body:'Use mythology cards as inspiration, not as historical certainty without sources.'},
 {theme:'style',title:'Capsule wardrobe',q:'capsule wardrobe history',body:'A smaller wardrobe can make outfit choice faster if pieces share colors and formality.'}
];
function seedCards(){return baseCards.concat(data.customCards||[])}
async function wikiSearch(){const q=smartQ.value||random(seedCards()).q;smartResults.innerHTML='<p>Searching Wikipedia...</p>';try{const s=await fetch(`https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(q)}&format=json&origin=*`).then(r=>r.json());const pages=s.query.search.slice(0,5);let html='';for(const p of pages){const title=p.title;const sum=await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title)}`).then(r=>r.json()).catch(()=>null);html+=`<div class="item"><b>${esc(title)}</b><p>${esc(sum?.extract||p.snippet.replace(/<[^>]+>/g,''))}</p><a target="_blank" href="https://en.wikipedia.org/wiki/${encodeURIComponent(title.replaceAll(' ','_'))}">Open source</a><br><button class="ghost" onclick='saveKnowledge(${JSON.stringify({title,body:sum?.extract||'',source:'Wikipedia'}).replaceAll("'","&apos;")})'>Save</button></div>`}smartResults.innerHTML=html||'<p>No results.</p>'}catch(e){smartResults.innerHTML='<p>Search failed.</p>'}}
function saveKnowledge(k){data.knowledgeSaved.push({...k,id:uid(),date:todayKey()});save();toast('Knowledge saved')}
function renderSmart(){const el=document.getElementById('smart');el.innerHTML=`<div class="grid"><div class="card span4"><h2>Smart Scroll</h2><label>Search a theme</label><input id="smartQ" placeholder="sleep, mythology, productivity"><button class="primary" onclick="wikiSearch()">Search sourced card</button><h3>Daily cards</h3>${seedCards().map(c=>`<span class="pill" onclick="smartQ.value='${esc(c.q)}';wikiSearch()">${esc(c.title)}</span>`).join('')}<p class="tiny">For scientific deep dives, use the source links in Settings/resources; the app keeps smart scroll light and cited.</p></div><div class="card span8"><h2>Results</h2><div id="smartResults" class="list">${seedCards().map(c=>`<div class="item"><b>${esc(c.title)}</b><p>${esc(c.body)}</p><button class="ghost" onclick="smartQ.value='${esc(c.q)}';wikiSearch()">Find sources</button></div>`).join('')}</div></div><div class="card span12"><h2>Saved archive</h2>${data.knowledgeSaved.map(k=>`<div class="item"><b>${esc(k.title)}</b><p>${esc(k.body)}</p><p class="tiny">${esc(k.source)} · ${esc(k.date)}</p></div>`).join('')||'<p>No saved cards yet.</p>'}</div></div>`}
function renderHabits(){const el=document.getElementById('habits');el.innerHTML=`<div class="grid"><div class="card span4"><h2>Add quest</h2><label>Habit name</label><input id="habitName"><button class="primary" onclick="data.habits.push({id:uid(),name:habitName.value||'New habit',done:{}});save();renderHabits()">Add</button><hr><h3>Workout ideas</h3>${['10 min mobility','20 min posture + core','lower body strength','walk outside','balance/agility drill'].map(w=>`<span class="pill">${w}</span>`).join('')}</div><div class="card span8"><h2>Today quests</h2><div class="list">${data.habits.map(h=>`<div class="item"><label><input style="width:auto" type="checkbox" ${h.done?.[todayKey()]?'checked':''} onchange="toggleHabit('${h.id}')"> <b>${esc(h.name)}</b></label><p class="tiny">Streak: ${streak(h)} days</p><button class="danger" onclick="data.habits=data.habits.filter(x=>x.id!=='${h.id}');save();renderHabits()">Delete</button></div>`).join('')}</div></div></div>`}
function streak(h){let s=0;for(let i=0;i<365;i++){const d=new Date(Date.now()-i*864e5).toISOString().slice(0,10);if(h.done?.[d])s++;else break}return s}
function exportData(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='aurelia-backup-'+todayKey()+'.json';a.click()}
function importDataFile(file,merge=false){if(!file)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(merge){if(j.customCards)data.customCards=(data.customCards||[]).concat(j.customCards);if(j.hiddenBooks)hiddenBooks.push(...j.hiddenBooks);if(j.events)data.events=data.events.concat(j.events);if(j.habits)data.habits=data.habits.concat(j.habits);data.changelog.push({date:todayKey(),note:'Imported data pack'});}else data={...defaultData,...j};save();renderAll();toast('Import complete')}catch(e){toast('Invalid JSON')}};r.readAsText(file)}
function renderSettings(){const el=document.getElementById('settings');el.innerHTML=`<div class="grid"><div class="card span6"><h2>Profile</h2><label>Name</label><input value="${esc(data.profile.name)}" onchange="data.profile.name=this.value;save()"><label>Default city</label><input value="${esc(data.profile.city||'')}" onchange="data.profile.city=this.value;save()"><label>Google Calendar Client ID</label><input value="${esc(data.profile.googleClientId||'')}" onchange="data.profile.googleClientId=this.value;save()"><p class="tiny">Only use a browser OAuth Client ID. Never paste API secrets into a static site.</p></div><div class="card span6"><h2>Backup + updates</h2><button class="primary" onclick="exportData()">Export all data</button><br><br><label>Import backup</label><input type="file" accept=".json" onchange="importDataFile(this.files[0],false)"><label>Import data pack / update pack</label><input type="file" accept=".json" onchange="importDataFile(this.files[0],true)"><p class="tiny">Data packs can add cards, resources, events, workouts, habits. This makes the app updateable without rebuilding.</p></div><div class="card span12"><h2>Free API connectors included</h2><span class="pill">Open-Meteo weather</span><span class="pill">Open Library books</span><span class="pill">Google Books metadata</span><span class="pill">Open Beauty Facts</span><span class="pill">Wikipedia smart scroll</span><span class="pill">Tatoeba links</span><span class="pill">Google Calendar optional OAuth</span><p class="tiny">Some services have limits or CORS rules. The app always keeps a no-key fallback: manual import, direct links, and local data.</p></div><div class="card span12"><h2>Changelog</h2>${data.changelog.map(c=>`<div class="item"><b>${esc(c.date)}</b><p>${esc(c.note)}</p></div>`).join('')||'<p>No updates imported yet.</p>'}</div></div>`}
function renderAll(rebuild=true){if(rebuild)buildNav();renderDashboard();renderCalendar();renderWardrobe();renderBooks();renderBeauty();renderLearning();renderSmart();renderHabits();renderSettings()}
renderAll();show('dashboard');
</script>
