<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Ilona OS</title>
  <link rel="icon" href="./assets/favicon.svg" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="theme-color" content="#17121d" />
  <style>
    :root{
      --bg:#0c0d12; --panel:#17131f; --panel2:#211827; --ink:#fff0d8; --muted:#c7b8a4;
      --gold:#e2bd6e; --rose:#a34d70; --wine:#672945; --sage:#6f8569; --line:rgba(255,255,255,.12);
      --good:#9dd69d; --bad:#ffaaaa; --shadow:0 22px 70px rgba(0,0,0,.42); --radius:24px;
    }
    *{box-sizing:border-box} html{scroll-behavior:smooth} body{margin:0;min-height:100vh;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;background:
      radial-gradient(circle at 20% -10%,rgba(163,77,112,.42),transparent 30%),
      radial-gradient(circle at 90% 10%,rgba(226,189,110,.18),transparent 28%),
      linear-gradient(135deg,#08090d,#17121d 50%,#090a0f);}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:44px 44px;mask-image:linear-gradient(to bottom,rgba(0,0,0,.9),transparent 85%)}
    h1,h2,h3{font-family:Georgia,serif;margin:.1rem 0 .55rem} h1{font-size:clamp(2rem,4vw,4rem);line-height:.95} h2{font-size:1.45rem} h3{font-size:1.08rem}.muted,.tiny{color:var(--muted)}.tiny{font-size:.82rem}.app{display:grid;grid-template-columns:292px 1fr;min-height:100vh}.side{position:sticky;top:0;height:100vh;padding:24px 18px;background:rgba(10,10,15,.78);border-right:1px solid var(--line);backdrop-filter:blur(16px);overflow:auto}.brand{display:flex;gap:12px;align-items:center;margin-bottom:22px}.crest{width:54px;height:54px;border-radius:20px;background:linear-gradient(135deg,var(--gold),var(--rose));color:#120e08;display:grid;place-items:center;font-weight:950;box-shadow:0 12px 30px rgba(226,189,110,.18)}.brand small{color:var(--muted)}.nav{display:grid;gap:8px}.nav button,.ghost,.primary,.danger,.softBtn{border:1px solid var(--line);background:rgba(255,255,255,.045);color:var(--ink);border-radius:16px;padding:12px 14px;cursor:pointer;font-weight:800;text-align:left;transition:.16s transform,.16s background}.nav button:hover,.ghost:hover,.softBtn:hover{transform:translateY(-1px);background:rgba(255,255,255,.075)}.nav button.active{background:linear-gradient(135deg,rgba(226,189,110,.26),rgba(163,77,112,.25));border-color:rgba(226,189,110,.52)}.primary{background:linear-gradient(135deg,var(--gold),#f2d990);color:#19110a;border:0;text-align:center}.danger{background:rgba(120,45,54,.25);border-color:rgba(255,150,150,.35);color:#ffd7d7;text-align:center}.ghost,.softBtn{text-align:center}.softBtn{background:rgba(226,189,110,.08)}.main{padding:calc(env(safe-area-inset-top) + 30px) 28px 34px;max-width:1400px;width:100%;margin:auto}.hero{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:22px}.hero p{color:var(--muted);max-width:840px;margin:.35rem 0}.actionBar{display:flex;gap:10px;flex-wrap:wrap;padding-top:8px;margin-top:6px}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}.card{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.034));border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);overflow:hidden}.card:before{content:"";position:absolute;inset:0 0 auto 0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.38),transparent);pointer-events:none}.span12{grid-column:span 12}.span8{grid-column:span 8}.span7{grid-column:span 7}.span6{grid-column:span 6}.span5{grid-column:span 5}.span4{grid-column:span 4}.span3{grid-column:span 3}.span2{grid-column:span 2}.pill{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:rgba(255,255,255,.055);border-radius:999px;padding:7px 11px;margin:4px 4px 4px 0;color:#f8e6c1;font-size:.88rem}.pill.good{background:rgba(117,175,111,.18);border-color:rgba(157,214,157,.35)}.pill.bad{background:rgba(163,77,112,.17)} label{display:block;font-size:.86rem;color:var(--muted);margin:0 0 6px} input,select,textarea{width:100%;background:#0e1018;color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:11px 12px;outline:none} textarea{min-height:92px;resize:vertical}.row{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.row4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.list{display:grid;gap:10px}.item{border:1px solid var(--line);border-radius:18px;padding:13px;background:rgba(0,0,0,.15)}.item p{color:var(--muted);margin:.35rem 0}.hidden{display:none!important}.quote{font-family:Georgia,serif;font-style:italic;color:#f2d99f}.clothes{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:12px}.cloth{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:rgba(0,0,0,.15)}.cloth img{width:100%;height:158px;object-fit:cover;display:block;background:#111}.cloth div{padding:10px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.tabs button{border:1px solid var(--line);border-radius:999px;padding:9px 13px;background:rgba(255,255,255,.045);color:var(--ink);cursor:pointer}.tabs button.active{background:var(--gold);color:#111}.progress{height:10px;background:#0f121c;border-radius:999px;overflow:hidden;border:1px solid var(--line)}.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--sage),var(--gold));width:0%}.resource a,.item a{color:#f1cf82}.miniCal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.day{min-height:82px;border:1px solid var(--line);border-radius:14px;padding:7px;background:rgba(255,255,255,.035);font-size:.82rem}.day.today{border-color:var(--gold);background:rgba(226,189,110,.12)}.eventdot{display:block;margin-top:4px;background:rgba(163,77,112,.55);border-radius:9px;padding:2px 5px;font-size:.72rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.routineGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.move{border-left:3px solid var(--gold);padding-left:10px}.bookCover{width:56px;height:82px;object-fit:cover;border-radius:9px;float:left;margin-right:12px;background:#111}.toast{position:fixed;right:20px;bottom:20px;background:#17131f;border:1px solid var(--line);border-radius:16px;padding:13px 16px;box-shadow:var(--shadow);z-index:99}.mobileTop{display:none}.stickyTools{position:sticky;top:0;z-index:3;background:linear-gradient(180deg,rgba(12,13,18,.98),rgba(12,13,18,.82));padding:calc(env(safe-area-inset-top) + 10px) 0 10px;margin-top:calc(-1 * env(safe-area-inset-top));backdrop-filter:blur(12px)}hr{border:0;border-top:1px solid var(--line);margin:14px 0}.checkline{display:flex;gap:9px;align-items:flex-start}.checkline input{width:auto;margin-top:4px}.kpi{font-size:2rem;font-family:Georgia,serif;color:#f3d383}.empty{border:1px dashed rgba(226,189,110,.32);border-radius:18px;padding:16px;background:rgba(226,189,110,.055)}
    @media(max-width:980px){.app{grid-template-columns:1fr}.side{display:none}.mobileTop{display:flex;position:sticky;top:0;z-index:30;background:rgba(10,10,15,.96);padding:calc(env(safe-area-inset-top) + 12px) 10px 10px;gap:8px;overflow:auto;border-bottom:1px solid var(--line);backdrop-filter:blur(14px)}.mobileTop button{white-space:nowrap}.main{padding:18px 14px 76px}.hero{display:block;padding-top:10px}.actionBar{margin-top:10px}.span8,.span7,.span6,.span5,.span4,.span3,.span2{grid-column:span 12}.row,.row3,.row4{grid-template-columns:1fr}.miniCal{grid-template-columns:repeat(2,1fr)}.day{min-height:65px}.card{padding:15px}.mobileBottom{display:grid!important}} .mobileBottom{display:none;position:fixed;left:0;right:0;bottom:0;z-index:40;grid-template-columns:repeat(5,1fr);gap:4px;padding:7px 8px calc(env(safe-area-inset-bottom) + 7px);background:rgba(10,10,15,.96);border-top:1px solid var(--line);backdrop-filter:blur(14px)}.mobileBottom button{font-size:.72rem;padding:8px 4px;border-radius:12px;text-align:center}
  </style>
</head>
<body>
<div class="mobileTop" id="mobileNav"></div>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="crest">I</div><div><h2>Ilona OS</h2><small>FMC lifestyle dashboard v3</small></div></div>
    <div class="nav" id="nav"></div>
    <div class="card" style="margin-top:16px"><div class="quote">“Dress, train, read, learn, glow, repeat.”</div><p class="tiny">Saved locally on this device. Use backup/export before clearing browser data.</p></div>
  </aside>
  <main class="main">
    <div class="hero">
      <div><h1 id="pageTitle">Dashboard</h1><p id="pageSub">A daily interactive lifestyle cockpit: routines, calendar, books, outfits, body-shape styling, workouts, learning and beauty.</p></div>
      <div class="actionBar"><button class="primary" onclick="generateDay()">Generate today</button><button class="softBtn" onclick="show('settings')">Backup / phone storage</button></div>
    </div>
    <section id="dashboard" class="page"></section>
    <section id="calendar" class="page hidden"></section>
    <section id="wardrobe" class="page hidden"></section>
    <section id="books" class="page hidden"></section>
    <section id="workouts" class="page hidden"></section>
    <section id="habits" class="page hidden"></section>
    <section id="beauty" class="page hidden"></section>
    <section id="learning" class="page hidden"></section>
    <section id="smart" class="page hidden"></section>
    <section id="settings" class="page hidden"></section>
  </main>
</div>
<div class="mobileBottom" id="mobileBottom"></div>
<div id="toast" class="toast hidden"></div>
<script>
const LS='ilona-os-v3-data';
const todayKey=()=>new Date().toISOString().slice(0,10);
const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);
const days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const frDays=['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
const defaultData={
  profile:{name:'Ilona',city:'Rennes',bodyShape:'bust-waist',height:'',styleNotes:'',colorPrefs:'black, burgundy, cream, gold',googleClientId:''},
  mood:'Dark Academia',energy:'Medium',occasion:'study',weather:null,dayPlan:null,
  clothes:[],events:[],weeklyWorkouts:{},routineChecks:{},customRoutine:[],
  habits:[{id:uid(),name:'Morning reset',done:{}},{id:uid(),name:'Move my body',done:{}},{id:uid(),name:'Read 10 pages',done:{}},{id:uid(),name:'Language drill',done:{}},{id:uid(),name:'Evening skincare',done:{}}],
  bookStatus:{},booksSaved:[],products:[],prices:[],knowledgeSaved:[],customCards:[],languageLog:[],changelog:[{date:todayKey(),note:'Installed Ilona OS v3'}],persisted:false
};
let data=load();
function load(){try{return deepMerge(structuredClone(defaultData),JSON.parse(localStorage.getItem(LS)||'{}'))}catch(e){return structuredClone(defaultData)}}
function deepMerge(a,b){for(const k in b){if(b[k]&&typeof b[k]==='object'&&!Array.isArray(b[k])&&a[k]&&typeof a[k]==='object'&&!Array.isArray(a[k]))deepMerge(a[k],b[k]);else a[k]=b[k]}return a}
function save(){localStorage.setItem(LS,JSON.stringify(data));}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2600)}
function esc(s=''){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function slug(s=''){return String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'')}
function random(a){return a[Math.floor(Math.random()*a.length)]}
const pages=[['dashboard','Dashboard','daily cockpit'],['calendar','Calendar','events + .ics'],['wardrobe','Outfits','closet + body shape'],['books','Books','romantasy oracle'],['workouts','Workouts','planned moves'],['habits','Routines','habits + daily checks'],['beauty','Beauty','skincare + prices'],['learning','Languages','Spanish, Japanese, LSF'],['smart','Smart Scroll','sourced knowledge'],['settings','Settings','backup + storage']];
function buildNav(){const n=document.getElementById('nav'),m=document.getElementById('mobileNav'),b=document.getElementById('mobileBottom');n.innerHTML=m.innerHTML=b.innerHTML='';pages.forEach(([id,label])=>{for(const c of [n,m]){const bt=document.createElement('button');bt.textContent=label;bt.dataset.page=id;bt.onclick=()=>show(id);c.appendChild(bt)}});[['dashboard','Home'],['wardrobe','Outfit'],['books','Books'],['workouts','Train'],['habits','Habits']].forEach(([id,label])=>{const bt=document.createElement('button');bt.textContent=label;bt.dataset.page=id;bt.className='softBtn';bt.onclick=()=>show(id);b.appendChild(bt)})}
function show(id){document.querySelectorAll('.page').forEach(p=>p.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');document.querySelectorAll('[data-page]').forEach(btn=>btn.classList.toggle('active',btn.dataset.page===id));const p=pages.find(x=>x[0]===id);document.getElementById('pageTitle').textContent=p[1];document.getElementById('pageSub').textContent=p[2];renderAll(false)}
const moods={
 'Soft Fae':{colors:['cream','white','rose','sage','pale blue'],outfit:'soft knit, flowing skirt or wide-leg trousers, delicate jewelry, ballet flats or clean sneakers',scent:'vanilla musk + clean lotion',food:'warm toast, fruit, protein yogurt',book:'healing magic, soft romance, forest court',routine:'gentle',workout:'Soft Fae Mobility'},
 'Dark Academia':{colors:['black','brown','grey','cream','burgundy'],outfit:'fitted top or turtleneck, tailored trousers, long coat/cardigan, boots, gold jewelry',scent:'amber, tea, vanilla, wood',food:'soup + bread or protein pasta',book:'libraries, court politics, morally grey tension',routine:'focus',workout:'Posture + Core'},
 'Warrior Mode':{colors:['black','forest green','deep red','charcoal','gold'],outfit:'structured top, high waist bottoms, boots, belt/waist detail, sleek hair',scent:'woody amber or dark vanilla',food:'high-protein comfort meal',book:'training arc, revenge, dragons, strategic FMC',routine:'discipline',workout:'Dragon Rider Strength'},
 'Royal Court':{colors:['cream','black','gold','burgundy','navy'],outfit:'polished fitted base, elegant trousers/skirt, coat, jewelry, clean shoes',scent:'powdery floral + amber',food:'pretty balanced plate',book:'gowns, politics, court intrigue, dangerous romance',routine:'polished',workout:'Royal Posture Pilates'},
 'Recovery Day':{colors:['cream','grey','soft brown','sage'],outfit:'matching lounge set or soft trousers, cardigan, simple jewelry',scent:'clean laundry or soft musk',food:'easy pasta/toastie/soup',book:'comfort fantasy, low-stress romance',routine:'repair',workout:'Recovery Stretch'}
};
const bodyAdvice={
 'bust-waist':{label:'Big bust / small waist',tips:['define the waist: belts, wrap shapes, fitted knits','square/V/scoop necks often feel less bulky than high stiff collars','balance with wide-leg/straight trousers or A-line skirts','avoid boxy tops unless tucked or cropped']},
 'hourglass':{label:'Hourglass',tips:['keep waist visible','choose fitted or gently structured pieces','match volume top/bottom']},
 'pear':{label:'Pear',tips:['bring detail near shoulders/neckline','straight or wide-leg bottoms','cropped jackets can define waist']},
 'rectangle':{label:'Rectangle',tips:['create shape with belts/layers','use contrast between fitted and loose pieces','try peplum/wrap/cropped tops']},
 'apple':{label:'Apple',tips:['open necklines and long vertical layers','structured jackets','avoid clingy midsection if uncomfortable']},
 'inverted':{label:'Inverted triangle',tips:['soften shoulders with simple tops','add volume/interest to bottoms','wide-leg trousers and skirts balance shape']}
};
const outfitFormulas={
 'Dark Academia':['black fitted top + wide-leg trousers + belt + loafers/boots + gold hoops','cream knit + dark skirt + tights + long coat + book tote','brown/black monochrome base + burgundy accent scarf + sleek bun'],
 'Warrior Mode':['black square-neck top + cargo/straight trousers + boots + belt','fitted long sleeve + wide-leg pants + structured jacket + dark jewelry','tank/top + cardigan tied at waist + sneakers for agility day'],
 'Royal Court':['cream blouse/top + black tailored trousers + gold jewelry + clean coat','burgundy or navy fitted top + long skirt + boots + perfume','monochrome base + one elegant statement accessory'],
 'Soft Fae':['soft knit + satin/flowy skirt + delicate necklace','cream top + pale trousers + cardigan + ballet flats','white shirt open over fitted top + light denim + soft scent'],
 'Recovery Day':['matching soft set + cardigan + claw clip','leggings/wide joggers + oversized knit + clean socks','soft tee tucked into comfortable trousers + simple jewelry']
};
function generateDay(){const m=moods[data.mood]||moods['Dark Academia'];const outfit=makeOutfitIdea();const w=workoutFor(data.mood,data.energy);data.dayPlan={date:todayKey(),mood:data.mood,energy:data.energy,occasion:data.occasion,aura:`${data.mood} ${data.energy} energy`,outfit,workout:w.name,book:m.book,beauty:m.scent,food:m.food,focus:routineByMood(data.mood).day[0],knowledge:random(seedCards()).title};save();renderAll();toast('Today planned')}
function nextEvents(n=3){return data.events.filter(e=>e.date>=todayKey()).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).slice(0,n)}
function completionToday(){const checks=Object.keys(data.routineChecks||{}).filter(k=>k.startsWith(todayKey()+':')&&data.routineChecks[k]).length;const habits=data.habits.filter(h=>h.done?.[todayKey()]).length;return {checks,habits,total:checks+habits}}
function renderDashboard(){const m=moods[data.mood]||moods['Dark Academia'];const plan=data.dayPlan;const c=completionToday();const events=nextEvents();const el=document.getElementById('dashboard');el.innerHTML=`<div class="grid">
 <div class="card span12"><div class="row4"><div><label>Mood</label><select id="dashMood" onchange="data.mood=this.value;save();renderDashboard()">${Object.keys(moods).map(x=>`<option ${data.mood===x?'selected':''}>${x}</option>`).join('')}</select></div><div><label>Energy</label><select onchange="data.energy=this.value;save();renderDashboard()"><option ${data.energy==='Low'?'selected':''}>Low</option><option ${data.energy==='Medium'?'selected':''}>Medium</option><option ${data.energy==='High'?'selected':''}>High</option></select></div><div><label>Occasion</label><select onchange="data.occasion=this.value;save();renderDashboard()"><option>study</option><option>work</option><option>date</option><option>chill</option><option>presentation</option><option>errands</option></select></div><div><label>City/weather</label><button class="ghost" onclick="getWeather()">Use phone location</button></div></div></div>
 <div class="card span7"><h2>Today: ${esc(plan?.aura||data.mood)}</h2><p class="quote">${esc(m.outfit)}</p><div class="routineGrid"><div class="item"><b>Outfit</b><p>${esc(plan?.outfit?.text||makeOutfitIdea().text)}</p><button class="ghost" onclick="show('wardrobe')">Open outfits</button></div><div class="item"><b>Workout</b><p>${esc(plan?.workout||workoutFor(data.mood,data.energy).name)}</p><button class="ghost" onclick="show('workouts')">Open workout</button></div><div class="item"><b>Book mood</b><p>${esc(plan?.book||m.book)}</p><button class="ghost" onclick="show('books')">Open books</button></div><div class="item"><b>Beauty / scent</b><p>${esc(plan?.beauty||m.scent)}</p><button class="ghost" onclick="show('beauty')">Open beauty</button></div></div></div>
 <div class="card span5"><h2>Command center</h2><div class="row3"><div class="item"><div class="kpi">${c.habits}/${data.habits.length}</div><p>habits done</p></div><div class="item"><div class="kpi">${c.checks}</div><p>routine checks</p></div><div class="item"><div class="kpi">${data.clothes.length}</div><p>closet items</p></div></div><p class="tiny">Weather: ${data.weather?`${Math.round(data.weather.temp)}°C · ${esc(data.weather.code)}`:'not loaded'}</p><button class="primary" onclick="generateDay()">Regenerate my day</button></div>
 <div class="card span6"><h2>Planned routine</h2>${routineHtml(data.mood)}</div>
 <div class="card span6"><h2>Calendar next</h2>${events.map(e=>`<div class="item"><b>${esc(e.title)}</b><p>${esc(e.date)} ${esc(e.time||'')} · ${esc(e.location||'')}</p></div>`).join('')||'<div class="empty">No upcoming events. Add events or import .ics in Calendar.</div>'}<button class="ghost" onclick="show('calendar')">Open calendar</button></div>
 <div class="card span12"><h2>Quick actions</h2><button class="softBtn" onclick="planWeek()">Plan workout week</button> <button class="softBtn" onclick="show('learning')">Daily language drill</button> <button class="softBtn" onclick="show('smart')">Smart scroll</button> <button class="softBtn" onclick="exportData()">Backup JSON</button></div>
 </div>`}
function getWeather(){if(!navigator.geolocation){toast('Geolocation unavailable');return}navigator.geolocation.getCurrentPosition(async pos=>{try{const {latitude,longitude}=pos.coords;const j=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,weather_code`).then(r=>r.json());data.weather={temp:j.current.temperature_2m,code:'weather code '+j.current.weather_code,date:todayKey()};save();renderDashboard();toast('Weather loaded')}catch(e){toast('Weather failed')}},()=>toast('Location refused'))}
function routineByMood(mood){const base={morning:['make bed + open curtains','water + quick face rinse','choose aura/mood','2 minute posture reset'],day:['one focused block','one outside/light moment','protein comfort meal','no-buy check before shopping'],night:['skincare simple routine','prepare outfit or formula','read 10 pages','phone away 10 min before sleep']};const add={
 'Warrior Mode':{morning:['5 min mobility','sleek hair / strong outfit'],day:['hardest task first','strength workout'],night:['stretch hips/shoulders','write tomorrow mission']},
 'Dark Academia':{morning:['prepare study drink','review top 3 tasks'],day:['50/10 study block','smart card'],night:['book chapter','reset desk']},
 'Soft Fae':{morning:['gentle music','soft outfit'],day:['walk or sunshine','language mini drill'],night:['comfort book','hair care']},
 'Royal Court':{morning:['polished outfit check','jewelry + scent'],day:['admin/social grace task','posture walk'],night:['tidy room 10 min','plan tomorrow look']},
 'Recovery Day':{morning:['no guilt start','hydration'],day:['minimum viable tasks','stretch only'],night:['repair skincare','early rest']}
 }[mood]||{};return {morning:[...base.morning,...(add.morning||[])],day:[...base.day,...(add.day||[])],night:[...base.night,...(add.night||[])]}}
function routineHtml(mood){const r=routineByMood(mood);return `<div class="routineGrid">${Object.entries(r).map(([part,tasks])=>`<div class="item"><h3>${part}</h3>${tasks.map(t=>checkLine(`routine:${part}:${t}`,t)).join('')}</div>`).join('')}</div>`}
function checkLine(id,text){const k=todayKey()+':'+id;return `<label class="checkline"><input type="checkbox" ${data.routineChecks[k]?'checked':''} onchange="data.routineChecks['${esc(k)}']=this.checked;save();renderDashboard()"><span>${esc(text)}</span></label>`}
function renderCalendar(){const el=document.getElementById('calendar');const month=new Date();const y=month.getFullYear(),m=month.getMonth();const first=new Date(y,m,1),last=new Date(y,m+1,0);let daysHtml='';for(let i=1;i<=last.getDate();i++){const d=new Date(y,m,i).toISOString().slice(0,10);const ev=data.events.filter(e=>e.date===d);daysHtml+=`<div class="day ${d===todayKey()?'today':''}"><b>${i}</b>${ev.map(e=>`<span class="eventdot">${esc(e.title)}</span>`).join('')}</div>`}el.innerHTML=`<div class="grid"><div class="card span4"><h2>Add event</h2><label>Title</label><input id="evTitle"><div class="row"><div><label>Date</label><input type="date" id="evDate" value="${todayKey()}"></div><div><label>Time</label><input type="time" id="evTime"></div></div><label>Location</label><input id="evLoc"><button class="primary" onclick="addEvent()">Add</button><hr><h3>Import .ics</h3><input type="file" accept=".ics,.txt" onchange="importICS(this.files[0])"><p class="tiny">For free static sites, .ics import and Google event links are the safest. Full live Google sync needs OAuth setup.</p></div><div class="card span8"><h2>${month.toLocaleString('default',{month:'long'})} ${y}</h2><div class="miniCal">${daysHtml}</div></div><div class="card span12"><h2>Events</h2><div class="list">${data.events.sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).map(e=>`<div class="item"><b>${esc(e.title)}</b><p>${esc(e.date)} ${esc(e.time||'')} · ${esc(e.location||'')}</p><button class="softBtn" onclick="openGoogleEvent('${e.id}')">Open as Google event</button> <button class="danger" onclick="data.events=data.events.filter(x=>x.id!=='${e.id}');save();renderCalendar()">Delete</button></div>`).join('')||'<p>No events.</p>'}</div></div></div>`}
function addEvent(){data.events.push({id:uid(),title:evTitle.value||'Untitled',date:evDate.value||todayKey(),time:evTime.value||'',location:evLoc.value||''});save();renderCalendar();toast('Event added')}
function openGoogleEvent(id){const e=data.events.find(x=>x.id===id);if(!e)return;const date=e.date.replaceAll('-','');const time=e.time?e.time.replace(':','')+'00':'090000';const end=e.time?String(Number(time.slice(0,2))+1).padStart(2,'0')+time.slice(2):'100000';window.open(`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(e.title)}&dates=${date}T${time}/${date}T${end}&location=${encodeURIComponent(e.location||'')}`,'_blank')}
function importICS(file){if(!file)return;const r=new FileReader();r.onload=()=>{const txt=r.result;const blocks=txt.split('BEGIN:VEVENT').slice(1);let count=0;blocks.forEach(b=>{const title=(b.match(/SUMMARY:(.*)/)||[])[1]||'Imported event';const dt=(b.match(/DTSTART(?:;[^:]*)?:(\d{8})(?:T(\d{4}))?/)||[]);if(dt[1]){data.events.push({id:uid(),title:title.trim(),date:dt[1].replace(/(\d{4})(\d{2})(\d{2})/,'$1-$2-$3'),time:dt[2]?dt[2].replace(/(\d{2})(\d{2})/,'$1:$2'):'',location:''});count++}});save();renderCalendar();toast(count+' events imported')};r.readAsText(file)}
function bodyTip(){const b=bodyAdvice[data.profile.bodyShape]||bodyAdvice['bust-waist'];return `${b.label}: ${b.tips.join(' · ')}`}
function makeOutfitIdea(){const m=moods[data.mood]||moods['Dark Academia'];const body=bodyAdvice[data.profile.bodyShape]||bodyAdvice['bust-waist'];const pool=data.clothes.filter(c=>m.colors.some(col=>(c.color||'').toLowerCase().includes(col.split(' ')[0]))||(c.tags||'').toLowerCase().includes(data.mood.toLowerCase().split(' ')[0]));if(pool.length>=2){return {type:'closet',text:`Closet-first: ${pool.slice(0,4).map(c=>c.name).join(' + ')}. Body note: ${body.tips[0]}. Palette: ${m.colors.join(', ')}.`}}return {type:'formula',text:`Formula: ${random(outfitFormulas[data.mood]||outfitFormulas['Dark Academia'])}. Body note: ${body.tips[0]}. Palette: ${m.colors.join(', ')}.`}}
function renderWardrobe(){const el=document.getElementById('wardrobe');const outfit=makeOutfitIdea();el.innerHTML=`<div class="grid"><div class="card span4"><h2>Profile styling</h2><label>Body shape / fit need</label><select onchange="data.profile.bodyShape=this.value;save();renderWardrobe()">${Object.entries(bodyAdvice).map(([k,v])=>`<option value="${k}" ${data.profile.bodyShape===k?'selected':''}>${v.label}</option>`).join('')}</select><label>Favorite colors</label><input value="${esc(data.profile.colorPrefs||'')}" onchange="data.profile.colorPrefs=this.value;save()"><p class="tiny">${esc(bodyTip())}</p><button class="primary" onclick="renderWardrobe()">Generate outfit idea</button></div><div class="card span8"><h2>Outfit even without clothes upload</h2><div class="empty"><b>${outfit.type==='closet'?'Closet-first look':'Formula look'}</b><p>${esc(outfit.text)}</p></div><h3>Mood color palette</h3>${(moods[data.mood]||moods['Dark Academia']).colors.map(c=>`<span class="pill">${esc(c)}</span>`).join('')}<h3>More formulas</h3>${(outfitFormulas[data.mood]||[]).map(x=>`<div class="item">${esc(x)}</div>`).join('')}</div><div class="card span4"><h2>Add clothing</h2><label>Photo</label><input type="file" accept="image/*" id="clothPhoto"><label>Name</label><input id="clothName" placeholder="black fitted top"><div class="row"><div><label>Category</label><select id="clothCat"><option>top</option><option>bottom</option><option>dress</option><option>shoes</option><option>coat</option><option>bag</option><option>jewelry</option></select></div><div><label>Color</label><input id="clothColor" placeholder="black"></div></div><label>Tags</label><input id="clothTags" placeholder="classy, dark academia, fitted"><button class="primary" onclick="addClothing()">Save clothing</button><p class="tiny">Images are compressed and saved locally in this browser. Export backups.</p></div><div class="card span8"><h2>Your closet</h2><div class="clothes">${data.clothes.map(c=>`<div class="cloth"><img src="${c.img||'./assets/favicon.svg'}"><div><b>${esc(c.name)}</b><p class="tiny">${esc(c.category)} · ${esc(c.color)} · ${esc(c.tags)}</p><button class="danger" onclick="data.clothes=data.clothes.filter(x=>x.id!=='${c.id}');save();renderWardrobe()">Delete</button></div></div>`).join('')||'<div class="empty">No clothes yet. The app can still create outfit formulas from mood + body shape.</div>'}</div></div></div>`}
async function addClothing(){const file=clothPhoto.files[0];const img=file?await compressImage(file):'';data.clothes.push({id:uid(),img,name:clothName.value||'Clothing item',category:clothCat.value,color:clothColor.value||'',tags:clothTags.value||''});save();renderWardrobe();toast('Clothing saved')}
function compressImage(file){return new Promise(res=>{const r=new FileReader();r.onload=e=>{const im=new Image();im.onload=()=>{const max=650,scale=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.72))};im.src=e.target.result};r.readAsDataURL(file)})}

function getBookStatus(t){return data.bookStatus[slug(t)]?.status||''}
function recommendBooks(){const q=(bookTrope.value||'').toLowerCase();const include=includeOwned?.checked;let arr=hiddenBooks.filter(b=>!q||[b.t,b.a,b.v,...b.tags].join(' ').toLowerCase().includes(q));if(!include)arr=arr.filter(b=>!['owned','read','dnf','hide'].includes(getBookStatus(b.t)));bookResults.innerHTML=arr.map(bookCard).join('')||'<p>No match because already owned/read/hidden or too strict. Tick include owned/read.</p>'}
function bookCard(b){const st=getBookStatus(b.t);const q=encodeURIComponent(b.t+' '+b.a);return `<div class="item"><b>${esc(b.t)}</b> <span class="pill ${st?'good':''}">${st||'new'}</span><p>${esc(b.a)} · ${esc(b.v)}</p><p>${b.tags.map(x=>`<span class="pill">${esc(x)}</span>`).join('')}</p><a target="_blank" href="https://openlibrary.org/search?q=${q}">Open Library</a> · <a target="_blank" href="https://www.google.com/search?tbm=bks&q=${q}">Google Books</a> · <a target="_blank" href="https://www.bookfinder.com/search/?keywords=${q}">BookFinder price search</a><br><button class="softBtn" onclick="setBookStatus('${esc(b.t)}','want',{author:'${esc(b.a)}'})">Want</button> <button class="softBtn" onclick="setBookStatus('${esc(b.t)}','owned',{author:'${esc(b.a)}'})">I own it</button> <button class="softBtn" onclick="setBookStatus('${esc(b.t)}','read',{author:'${esc(b.a)}'})">Read</button> <button class="danger" onclick="setBookStatus('${esc(b.t)}','hide',{author:'${esc(b.a)}'})">Hide</button></div>`}
async function searchBooks(){const q=bookSearch.value||'romantasy strong female lead';bookApiResults.innerHTML='<p>Searching books...</p>';try{const [ol,gb]=await Promise.all([fetch(`https://openlibrary.org/search.json?q=${encodeURIComponent(q)}&limit=8`).then(r=>r.json()),fetch(`https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(q)}&maxResults=8`).then(r=>r.json()).catch(()=>({items:[]}))]);let html='<h3>Open Library</h3>'+ol.docs.slice(0,8).map(d=>{const title=d.title,author=(d.author_name||[]).join(', ');const cover=d.cover_i?`https://covers.openlibrary.org/b/id/${d.cover_i}-M.jpg`:'';return `<div class="item">${cover?`<img class="bookCover" src="${cover}">`:''}<b>${esc(title)}</b> <span class="pill">${getBookStatus(title)||'new'}</span><p>${esc(author)}</p><a target="_blank" href="https://openlibrary.org${d.key}">Open</a><br><button class="softBtn" onclick="setBookStatus('${esc(title)}','want',{author:'${esc(author)}'})">Want</button> <button class="softBtn" onclick="setBookStatus('${esc(title)}','owned',{author:'${esc(author)}'})">Owned</button> <button class="softBtn" onclick="setBookStatus('${esc(title)}','read',{author:'${esc(author)}'})">Read</button><div style="clear:both"></div></div>`}).join('');html+='<h3>Google Books</h3>'+((gb.items||[]).map(it=>{const v=it.volumeInfo||{},title=v.title||'Untitled',author=(v.authors||[]).join(', ');return `<div class="item"><b>${esc(title)}</b><p>${esc(author)}</p>${v.previewLink?`<a target="_blank" href="${v.previewLink}">Preview</a>`:''}<br><button class="softBtn" onclick="setBookStatus('${esc(title)}','want',{author:'${esc(author)}'})">Want</button> <button class="softBtn" onclick="setBookStatus('${esc(title)}','owned',{author:'${esc(author)}'})">Owned</button> <button class="softBtn" onclick="setBookStatus('${esc(title)}','read',{author:'${esc(author)}'})">Read</button></div>`}).join('')||'<p>No Google results.</p>');bookApiResults.innerHTML=html}catch(e){bookApiResults.innerHTML='<p>Search failed.</p>'}}
function renderBooks(){const owned=Object.values(data.bookStatus).filter(x=>x.status==='owned').length,read=Object.values(data.bookStatus).filter(x=>x.status==='read').length;const el=document.getElementById('books');el.innerHTML=`<div class="grid"><div class="card span4"><h2>Romantasy oracle</h2><p class="tiny">Mark owned/read/hide and recommendations update automatically.</p><label>Trope / vibe</label><input id="bookTrope" placeholder="court politics, warrior FMC, fae"><label><input style="width:auto" type="checkbox" id="includeOwned"> include owned/read/hidden</label><button class="primary" onclick="recommendBooks()">Recommend</button><hr><h3>Library stats</h3><span class="pill good">Owned: ${owned}</span><span class="pill good">Read: ${read}</span></div><div class="card span8"><h2>Not-too-obvious recommendations</h2><div id="bookResults" class="list">${hiddenBooks.filter(b=>!['owned','read','hide'].includes(getBookStatus(b.t))).slice(0,6).map(bookCard).join('')}</div></div><div class="card span4"><h2>Search real books</h2><input id="bookSearch" placeholder="romantasy dragon rider"><button class="primary" onclick="searchBooks()">Search Open Library + Google</button></div><div class="card span8"><h2>API results</h2><div id="bookApiResults" class="list"><p>Search to load live book metadata.</p></div></div><div class="card span12"><h2>Your book shelf statuses</h2><div class="list">${Object.values(data.bookStatus).map(b=>`<div class="item"><b>${esc(b.title)}</b><p>${esc(b.author||'')} · ${esc(b.status)} · ${esc(b.date)}</p><button class="danger" onclick="delete data.bookStatus['${slug(b.title)}'];save();renderBooks()">Remove status</button></div>`).join('')||'<p>No saved book status yet.</p>'}</div></div></div>`}

function workoutFor(mood,energy){let name=(moods[mood]||moods['Dark Academia']).workout;if(energy==='Low'&&name!=='Recovery Stretch')name='Soft Fae Mobility';if(mood==='Recovery Day')name='Recovery Stretch';return {name,moves:workoutTemplates[name]||workoutTemplates['Posture + Core']}}

function renderHabits(){const el=document.getElementById('habits');el.innerHTML=`<div class="grid"><div class="card span4"><h2>Habit quest</h2><input id="habitName" placeholder="new habit"><button class="primary" onclick="data.habits.push({id:uid(),name:habitName.value||'New habit',done:{}});save();renderHabits()">Add habit</button><hr><h3>Routine mood</h3><select onchange="data.mood=this.value;save();renderHabits()">${Object.keys(moods).map(x=>`<option ${data.mood===x?'selected':''}>${x}</option>`).join('')}</select><p class="tiny">Routines update by mood and checkboxes are saved for today.</p></div><div class="card span8"><h2>Habits today</h2><div class="list">${data.habits.map(h=>`<div class="item"><label class="checkline"><input type="checkbox" ${h.done?.[todayKey()]?'checked':''} onchange="toggleHabit('${h.id}')"><span><b>${esc(h.name)}</b><br><span class="tiny">streak: ${streak(h)} days</span></span></label><button class="danger" onclick="data.habits=data.habits.filter(x=>x.id!=='${h.id}');save();renderHabits()">Delete</button></div>`).join('')}</div></div><div class="card span12"><h2>Planned FMC routine — ${esc(data.mood)}</h2>${routineHtml(data.mood)}</div></div>`}
function toggleHabit(id){const h=data.habits.find(x=>x.id===id);h.done=h.done||{};h.done[todayKey()]=!h.done[todayKey()];save();renderHabits()}

async function searchBeauty(){const q=beautyQ.value||'moisturizer';beautyResults.innerHTML='<p>Searching Open Beauty Facts...</p>';try{const j=await fetch(`https://world.openbeautyfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&action=process&json=1&page_size=8`).then(r=>r.json());beautyResults.innerHTML=(j.products||[]).map(p=>`<div class="item"><b>${esc(p.product_name||'Unnamed')}</b><p>${esc(p.brands||'')} · ${esc(p.categories||'')}</p><p class="tiny">${esc((p.ingredients_text||'').slice(0,230))}</p><button class="softBtn" onclick="data.products.push({id:uid(),name:'${esc(p.product_name||'Product')}',brand:'${esc(p.brands||'')}',ingredients:'${esc((p.ingredients_text||'').slice(0,500))}'});save();renderBeauty()">Save</button></div>`).join('')||'<p>No product found.</p>'}catch(e){beautyResults.innerHTML='<p>Search failed.</p>'}}
function addPrice(){data.prices.push({id:uid(),name:priceName.value||'Product',store:priceStore.value||'',price:Number(priceValue.value||0),link:priceLink.value||'',date:todayKey()});save();renderBeauty();toast('Price saved')}
function renderBeauty(){const m=moods[data.mood]||moods['Dark Academia'];const cheapest=[...data.prices].sort((a,b)=>a.price-b.price)[0];const el=document.getElementById('beauty');el.innerHTML=`<div class="grid"><div class="card span4"><h2>Beauty routine</h2><p><b>Morning:</b> cleanser/rinse → moisturizer → sunscreen → scent layer.</p><p><b>Night:</b> cleanse → moisturizer → only one active if you already tolerate it.</p><p><b>Mood scent:</b> ${esc(m.scent)}</p><span class="pill">no 15-step chaos</span><span class="pill">patch test</span><span class="pill">SPF</span></div><div class="card span4"><h2>Search products</h2><input id="beautyQ" placeholder="cerave moisturizer, sunscreen"><button class="primary" onclick="searchBeauty()">Search Open Beauty Facts</button></div><div class="card span4"><h2>Manual price tracker</h2><input id="priceName" placeholder="product name"><input id="priceStore" placeholder="store"><input id="priceValue" type="number" step="0.01" placeholder="price"><input id="priceLink" placeholder="link"><button class="primary" onclick="addPrice()">Save price</button>${cheapest?`<p class="tiny">Cheapest saved: ${esc(cheapest.name)} at ${esc(cheapest.store)} — ${cheapest.price}€</p>`:''}</div><div class="card span6"><h2>Product results</h2><div id="beautyResults" class="list"><p>Search to load product data.</p></div></div><div class="card span6"><h2>Saved prices</h2>${data.prices.map(p=>`<div class="item"><b>${esc(p.name)}</b><p>${esc(p.store)} · ${p.price}€</p>${p.link?`<a target="_blank" href="${esc(p.link)}">Open link</a>`:''}<br><button class="danger" onclick="data.prices=data.prices.filter(x=>x.id!=='${p.id}');save();renderBeauty()">Delete</button></div>`).join('')||'<p>No prices yet.</p>'}</div><div class="card span12"><h2>Saved products</h2>${data.products.map(p=>`<div class="item"><b>${esc(p.name)}</b><p>${esc(p.brand)}</p><p class="tiny">${esc(p.ingredients)}</p></div>`).join('')||'<p>No saved products.</p>'}</div></div>`}
const resources={
 Spanish:[['Language Transfer Complete Spanish','https://www.languagetransfer.org/complete-spanish'],['Dreaming Spanish free videos','https://www.dreamingspanish.com/browse'],['SpanishDict conjugation','https://www.spanishdict.com/conjugation'],['Tatoeba Spanish sentences','https://tatoeba.org/en/sentences/search?from=spa&to=eng&query=']],
 Japanese:[['NHK Easy Japanese','https://www.nhk.or.jp/lesson/en/'],['Tae Kim Grammar Guide','https://guidetojapanese.org/learn/'],['Jisho dictionary','https://jisho.org/'],['Tofugu kana resources','https://www.tofugu.com/japanese/learn-hiragana/']],
 LSF:[['Dico Elix LSF','https://dico.elix-lsf.fr/'],['Elix videos','https://www.elix-lsf.fr/'],['Spread The Sign French signs','https://www.spreadthesign.com/fr.fr/search/'],['Académie de la Langue des Signes Française','https://www.languedessignes.fr/']]
};
function makeDrill(){const lang=langSel.value;const tasks={Spanish:['10 min Language Transfer or Dreaming Spanish','write 5 sentences about today','review 8 verbs in present/past','shadow 3 Tatoeba sentences'],Japanese:['learn/review 5 kana/kanji/vocab','read one NHK mini lesson','search 5 words in Jisho','write 3 simple sentences'],LSF:['learn 5 signs on Elix/SpreadTheSign','record yourself signing 3 words','review facial expression/body placement','search signs for your daily routine']};drillBox.innerHTML=`<div class="item"><h3>${lang} drill</h3>${tasks[lang].map(t=>`<p>□ ${t}</p>`).join('')}<button class="primary" onclick="data.languageLog.push({id:uid(),date:todayKey(),lang:'${lang}',note:'completed drill'});save();renderLearning()">Mark done</button></div>`}
function renderLearning(){const el=document.getElementById('learning');el.innerHTML=`<div class="grid"><div class="card span4"><h2>Language cockpit</h2><label>Language</label><select id="langSel"><option>Spanish</option><option>Japanese</option><option>LSF</option></select><button class="primary" onclick="makeDrill()">Generate daily drill</button><div id="drillBox"></div></div><div class="card span8"><h2>Actual free links</h2>${Object.entries(resources).map(([k,arr])=>`<div class="item resource"><h3>${k}</h3>${arr.map(([n,u])=>`<p><a target="_blank" href="${u}">${n}</a></p>`).join('')}</div>`).join('')}</div><div class="card span12"><h2>Learning log</h2>${data.languageLog.map(l=>`<div class="item"><b>${esc(l.lang)}</b><p>${esc(l.date)} · ${esc(l.note)}</p></div>`).join('')||'<p>No log yet.</p>'}</div></div>`}
const baseCards=[{theme:'fitness',title:'Progressive overload',q:'progressive overload strength training',body:'Training improves when difficulty increases gradually: reps, load, range, control or frequency.'},{theme:'skincare',title:'Sunscreen is the boring glow-up',q:'sunscreen photoaging dermatology',body:'A simple routine repeated consistently usually beats product chaos.'},{theme:'mythology',title:'Valkyries and warrior imagery',q:'Valkyrie Norse mythology',body:'Use mythology as inspiration, then check sources for history.'},{theme:'learning',title:'Spaced repetition',q:'spaced repetition learning memory',body:'Short repeated reviews beat cramming for long-term language memory.'},{theme:'style',title:'Capsule wardrobe',q:'capsule wardrobe',body:'A repeated palette makes outfits easier and more expensive-looking.'}];
function seedCards(){return baseCards.concat(data.customCards||[])}
async function wikiSearch(){const q=smartQ.value||random(seedCards()).q;smartResults.innerHTML='<p>Searching sourced cards...</p>';try{const s=await fetch(`https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(q)}&format=json&origin=*`).then(r=>r.json());const pages=s.query.search.slice(0,5);let html='';for(const p of pages){const title=p.title;const sum=await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title)}`).then(r=>r.json()).catch(()=>null);html+=`<div class="item"><b>${esc(title)}</b><p>${esc(sum?.extract||p.snippet.replace(/<[^>]+>/g,''))}</p><a target="_blank" href="https://en.wikipedia.org/wiki/${encodeURIComponent(title.replaceAll(' ','_'))}">Open source</a><br><button class="softBtn" onclick='saveKnowledge(${JSON.stringify({title,body:sum?.extract||'',source:'Wikipedia'}).replaceAll("'","&apos;")})'>Save</button></div>`}smartResults.innerHTML=html||'<p>No results.</p>'}catch(e){smartResults.innerHTML='<p>Search failed.</p>'}}
function saveKnowledge(k){data.knowledgeSaved.push({...k,id:uid(),date:todayKey()});save();toast('Saved')}
function renderSmart(){const el=document.getElementById('smart');el.innerHTML=`<div class="grid"><div class="card span4"><h2>Smart scroll</h2><input id="smartQ" placeholder="sleep, mythology, productivity"><button class="primary" onclick="wikiSearch()">Search source</button><h3>Daily themes</h3>${seedCards().map(c=>`<span class="pill" onclick="smartQ.value='${esc(c.q)}';wikiSearch()">${esc(c.title)}</span>`).join('')}</div><div class="card span8"><h2>Results</h2><div id="smartResults" class="list">${seedCards().map(c=>`<div class="item"><b>${esc(c.title)}</b><p>${esc(c.body)}</p><button class="softBtn" onclick="smartQ.value='${esc(c.q)}';wikiSearch()">Find sources</button></div>`).join('')}</div></div><div class="card span12"><h2>Saved archive</h2>${data.knowledgeSaved.map(k=>`<div class="item"><b>${esc(k.title)}</b><p>${esc(k.body)}</p><p class="tiny">${esc(k.source)} · ${esc(k.date)}</p></div>`).join('')||'<p>No saved cards yet.</p>'}</div></div>`}
async function requestPersistentStorage(){if(!navigator.storage||!navigator.storage.persist){toast('Persistent storage not supported here');return}const ok=await navigator.storage.persist();data.persisted=ok;save();renderSettings();toast(ok?'Phone/browser storage protected':'Storage persistence not granted')}
async function storageEstimate(){if(!navigator.storage||!navigator.storage.estimate){storageBox.innerHTML='<p>Storage estimate unsupported.</p>';return}const e=await navigator.storage.estimate();storageBox.innerHTML=`<div class="item"><b>Storage estimate</b><p>Used: ${Math.round((e.usage||0)/1024/1024)} MB · Quota: ${Math.round((e.quota||0)/1024/1024)} MB</p><p class="tiny">This app uses browser storage, not a paid database. Photos can fill storage, so export backups.</p></div>`}
function exportData(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ilona-os-backup-'+todayKey()+'.json';a.click()}
function importDataFile(file,merge=false){if(!file)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(merge){if(j.customCards)data.customCards=(data.customCards||[]).concat(j.customCards);if(j.events)data.events=data.events.concat(j.events);if(j.habits)data.habits=data.habits.concat(j.habits);if(j.clothes)data.clothes=data.clothes.concat(j.clothes);if(j.bookStatus)data.bookStatus={...data.bookStatus,...j.bookStatus};data.changelog.push({date:todayKey(),note:'Imported update/data pack'});}else data=deepMerge(structuredClone(defaultData),j);save();renderAll();toast('Import complete')}catch(e){toast('Invalid JSON')}};r.readAsText(file)}
function installPWA(){toast('On phone: browser menu → Add to Home screen. This version includes PWA manifest.')}
function renderSettings(){const el=document.getElementById('settings');el.innerHTML=`<div class="grid"><div class="card span6"><h2>Profile</h2><label>Name</label><input value="${esc(data.profile.name)}" onchange="data.profile.name=this.value;save();renderAll()"><label>City</label><input value="${esc(data.profile.city||'')}" onchange="data.profile.city=this.value;save()"><label>Body shape</label><select onchange="data.profile.bodyShape=this.value;save()">${Object.entries(bodyAdvice).map(([k,v])=>`<option value="${k}" ${data.profile.bodyShape===k?'selected':''}>${v.label}</option>`).join('')}</select><label>Style notes</label><textarea onchange="data.profile.styleNotes=this.value;save()">${esc(data.profile.styleNotes||'')}</textarea></div><div class="card span6"><h2>Phone / local storage</h2><button class="primary" onclick="requestPersistentStorage()">Ask browser to keep local data</button><button class="softBtn" onclick="storageEstimate()">Check storage</button><button class="softBtn" onclick="installPWA()">Install on phone</button><div id="storageBox" class="list"><p class="tiny">Local storage does not need a normal permission popup. The browser stores this app on your device. This button asks for persistent storage when supported.</p></div><p class="tiny">Persistent storage: ${data.persisted?'granted':'not granted/unknown'}</p></div><div class="card span6"><h2>Backup</h2><button class="primary" onclick="exportData()">Export all data JSON</button><label>Import full backup</label><input type="file" accept=".json" onchange="importDataFile(this.files[0],false)"><label>Import update/data pack</label><input type="file" accept=".json" onchange="importDataFile(this.files[0],true)"></div><div class="card span6"><h2>Free connectors</h2><span class="pill">Open Library</span><span class="pill">Google Books</span><span class="pill">Open Beauty Facts</span><span class="pill">Open-Meteo</span><span class="pill">Wikipedia</span><span class="pill">.ics Calendar</span><p class="tiny">No paid backend. Full live calendar sync can be added later with OAuth, but manual/.ics links work now.</p></div><div class="card span12"><h2>Changelog</h2>${data.changelog.map(c=>`<div class="item"><b>${esc(c.date)}</b><p>${esc(c.note)}</p></div>`).join('')}</div></div>`}
function renderAll(rebuild=true){if(rebuild)buildNav();renderDashboard();renderCalendar();renderWardrobe();renderBooks();renderWorkouts();renderHabits();renderBeauty();renderLearning();renderSmart();renderSettings()}
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{})}
renderAll();show('dashboard');
</script>
</body>
</html>
